name: Tachyon warm
description: >
  Restores workspace paths (node_modules etc.) from the repo's Tachyon
  prebuild after actions/checkout, and sets TACHYON_WARM=hit or miss.
  Outside Tachyon it does nothing and sets TACHYON_WARM=miss, so workflows
  stay portable.
outputs:
  warm:
    description: hit or miss
    value: ${{ steps.warm.outputs.warm }}
runs:
  using: composite
  steps:
    - id: warm
      shell: bash
      run: |
        set -euo pipefail
        # The guest agent stashes prebuild workspace paths here before the
        # runner starts, because actions/checkout cleans untracked files.
        stash="${TACHYON_WARM_STASH:-/opt/tachyon/warm}"
        result=miss
        if [[ -n "${TACHYON_JOB_ID:-}" && "${TACHYON_PREBUILD_MATCH:-none}" == full && -n "${TACHYON_WARM_PATHS:-}" ]]; then
          result=hit
          IFS=: read -ra paths <<< "$TACHYON_WARM_PATHS"
          for p in "${paths[@]}"; do
            case "$p" in /*|*..*) echo "::warning::skipping unsafe warm path $p"; result=miss; continue;; esac
            if [[ -e "$stash/$p" ]]; then
              mkdir -p "$(dirname "$GITHUB_WORKSPACE/$p")"
              rm -rf "${GITHUB_WORKSPACE:?}/$p"
              # Same filesystem: a rename, not a copy.
              mv "$stash/$p" "$GITHUB_WORKSPACE/$p"
            else
              result=miss
            fi
          done
        fi
        # Tools that compare file times with their outputs (cargo, make) would
        # rebuild everything, since checkout gives every file a new mtime.
        # Age the tracked files, then touch only what changed since the
        # commit the prebuild's outputs were built from (refreshes keep it).
        base=$(sed -n 's/^commit=//p' "$HOME/.tachyon/prebuild" 2>/dev/null || true)
        if [[ $result == hit && -n "$base" ]] && git -C "$GITHUB_WORKSPACE" rev-parse -q --verify HEAD >/dev/null; then
          cd "$GITHUB_WORKSPACE"
          if git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$base" 2>/dev/null; then
            git ls-files -z | xargs -0 -r touch -h -d @1
            git diff --name-only --diff-filter=d -z "$base" HEAD | xargs -0 -r touch -h -c
            echo "Tachyon warm: file times reset against prebuild ${base:0:7}"
          else
            echo "::warning::prebuild commit $base not fetchable; file times left as checked out"
          fi
        fi
        echo "TACHYON_WARM=$result" >> "$GITHUB_ENV"
        echo "warm=$result" >> "$GITHUB_OUTPUT"
        echo "Tachyon warm: $result (prebuild match: ${TACHYON_PREBUILD_MATCH:-n/a})"

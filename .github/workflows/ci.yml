name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code gen/

  hostd:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hostd
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from hostd/rust-toolchain.toml, so CI and local
      # builds run the same clippy.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
